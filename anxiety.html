<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anxiety | Meraki</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom right, #a8d8ff, #0f2027);
    color: #f5f5dc;
    text-align: center;
    padding: 40px 20px;
}

h1 { font-size: 3rem; margin-bottom: 20px; }

.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    margin-top: 40px;
}

.image-card {
    position: relative;
    width: 300px;
    height: 350px;
    border-radius: 15px;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.image-card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(168,216,255,0.7);
}

.card-title {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 15px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    color: #fff8e7;
    font-size: 1.5rem;
    font-weight: bold;
}

.card-description {
    position: absolute;
    bottom: -100%;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    color: #f5f5dc;
    display: flex;
    flex-direction: column;    /* vertical stacking */
    align-items: center;       /* horizontal center */
    justify-content: center;   /* vertical center */
    text-align: center;        /* center text */
    padding: 20px;
    box-sizing: border-box;
    overflow-wrap: break-word;
    word-break: break-word;
    transition: bottom 0.4s ease;
}

.image-card:hover .card-description { bottom: 0; }
.image-card:hover .card-title { opacity: 0.3; }

a {
    color: #fff8e7;
    text-decoration: none;
    font-size: 1rem;
    display: block;
    margin-top: 30px;
}

@media (max-width: 768px) {
    .image-card { width: 90%; height: 300px; }
}
</style>
</head>
<body>

<h1>Anxiety</h1>
<p>Learn about common causes and effects of anxiety.</p>

<div class="card-container">
    <!-- Cause -->
    <article class="image-card" style="background-image:url('anxiety_cause.jpg');">
        <div class="card-title">Common Cause</div>
        <div class="card-description">
            Stressful life events, trauma, or genetics can trigger anxiety disorders.
        </div>
    </article>

    <!-- Effect -->
    <article class="image-card" style="background-image:url('anxiety_effect.jpg');">
        <div class="card-title">Common Effect</div>
        <div class="card-description">
            Persistent worry, restlessness, and difficulty concentrating are common effects.
        </div>
    </article>
</div>

<a href="index.html">⬅ Back to Home</a>

</body>
</html>
